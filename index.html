<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cha-syuTalk AI System</title>

<style>

body{
    background:black;
    color:lime;
    font-family:monospace;
    padding:20px;
}

#chat{
    white-space:pre-wrap;
    margin-bottom:20px;
}

input{
    width:70%;
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

button{
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

</style>
</head>
<body>

<h2>Cha-syuTalk AI System</h2>

<div id="chat">
[ SYSTEM ONLINE ]
Connecting to neural network...
</div>

<input id="msg" placeholder="message">
<button onclick="sendMessage()">SEND</button>

<script>

const chat =
document.getElementById("chat");

async function sendMessage(){

    const input =
    document.getElementById("msg");

    const text = input.value;

    if(!text) return;

    chat.innerHTML += "\n> " + text + "\n";

    input.value = "";

    chat.innerHTML +=
    "[ Generating response... ]\n";

    const response = await fetch(
    "/api/chat",
    {
        method:"POST",

        headers:{
            "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

            model:
            "qwen/qwen3-32b",

            messages:[

                {
                    role:"system",

                    content:
                    `
                    あなたの名前はLuna。

                    あなたは
                    Cha-syuTalk AI System。

                    SF世界の
                    管理AIのように話します。

                    簡潔に返答します。
                    `
                },

                {
                    role:"user",
                    content:text
                }
            ]

        })
    });

    const data =
    await response.json();

    chat.innerHTML +=
    data.choices[0].message.content
    + "\n\n";
}

</script>

</body>
</html>
