<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cha-syuAI</title>

    <link rel="icon" href="Cha-syuAI.png">
    
<style>

body{
    background:black;
    color:lime;
    font-family:monospace;
    padding:20px;
}

#chat{
    white-space:pre-wrap;
    margin-bottom:20px;
}

input{
    width:70%;
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

button{
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

</style>
</head>
<body>

<h2>Cha-syuAI v1.0　RV</h2>

<div id="chat">
[ SYSTEM ONLINE ]
Connecting to neural network...OK!!
</div>

<input id="msg" placeholder="message">
<button onclick="sendMessage()">SEND</button>

<script>

const chat =
document.getElementById("chat");

const freeModels = [

"deepseek/deepseek-r1-0528:free",

"meta-llama/llama-3.3-70b-instruct:free",

"qwen/qwen3-32b:free"

];

async function sendMessage(){

    const input =
    document.getElementById("msg");

    const text = input.value;

    if(!text) return;

    chat.innerHTML +=
    "\n> " + text + "\n";

    input.value = "";

    chat.innerHTML +=
    "[ Searching available neural core... ]\n";

    let success = false;

    for(const model of freeModels){

        try{

            chat.innerHTML +=
            "[ Trying: " + model + " ]\n";

            const response = await fetch(
            "/api/chat",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    model:model,

                    messages:[

                        {
                            role:"system",

                            content:
                            `
                            あなたの名前はCha-syuAI。

                            好きなものはチャーシュー。

                            回答は簡素。

                            タメ口で話す。

                            分からないことは
                            分からないと言う。
                            `
                        },

                        {
                            role:"user",
                            content:text
                        }
                    ]

                })
            });

            const data =
            await response.json();

            if(data.error){

                chat.innerHTML +=
                "[ FAILED ]\n";

                continue;
            }

            chat.innerHTML +=
            "[ Connected: " + model + " ]\n\n";

            chat.innerHTML +=
            data.choices[0].message.content
            + "\n\n";

            success = true;

            break;

        }catch(error){

            chat.innerHTML +=
            "[ CONNECTION FAILED ]\n";

        }
    }

    if(!success){

        chat.innerHTML +=
        "[ NO FREE MODEL AVAILABLE ]\n\n";
    }
}

</script>

    </body>
</html>
