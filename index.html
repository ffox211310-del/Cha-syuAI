<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cha-syuAI</title>

    <link rel="icon" href="Cha-syuAI.png">
    
<style>

body{
    background:black;
    color:lime;
    font-family:monospace;
    padding:20px;
}

#chat{
    white-space:pre-wrap;
    margin-bottom:20px;
}

input{
    width:70%;
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

button{
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

</style>
</head>
<body>

<h2>Cha-syuAI v1.0</h2>

<div id="chat">
[ SYSTEM ONLINE ]
Connecting to neural network
</div>

<input id="msg" placeholder="message">
<button onclick="sendMessage()">SEND</button>

<script>

const chat =
document.getElementById("chat");

const fallbackModel =
"qwen/qwen3-32b";

async function sendMessage(){

    const input =
    document.getElementById("msg");

    const text =
    input.value.trim();

    if(!text) return;

    chat.innerHTML +=
    "\n> " + text + "\n";

    input.value = "";

    chat.innerHTML +=
    "[ Searching free neural core... ]\n";

    let data;

    try{

        const freeResponse =
        await fetch(
        "/api/chat",
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                model:
                "openrouter/free",

                messages:[

                    {
                        role:"system",

                        content:
                        `
                        あなたの名前はCha-syuAI。

                        好きなものはチャーシュー。

                        回答は簡素。

                        タメ口。

                        分からないことは
                        分からないと言う。
                        `
                    },

                    {
                        role:"user",
                        content:text
                    }
                ]
            })
        });

        data =
        await freeResponse.json();

        if(
            freeResponse.ok &&
            !data.error &&
            data.choices
        ){

            chat.innerHTML +=
            "[ Free core connected ]\n";

        }else{

            throw new Error();
        }

    }catch{

        chat.innerHTML +=
        "[ Free models unavailable ]\n";

        chat.innerHTML +=
        "[ Emergency Qwen routing... ]\n";

        const paidResponse =
        await fetch(
        "/api/chat",
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                model:
                fallbackModel,

                messages:[

                    {
                        role:"system",

                        content:
                        `
                        あなたの名前はCha-syuAI。

                        好きなものはチャーシュー。

                        回答は簡素。

                        タメ口。

                        分からないことは
                        分からないと言う。
                        `
                    },

                    {
                        role:"user",
                        content:text
                    }
                ]
            })
        });

        data =
        await paidResponse.json();

        chat.innerHTML +=
        "[ Qwen emergency link established ]\n";
    }

    if(data.error){

        chat.innerHTML +=
        "[ ERROR ] "
        + data.error.message +
        "\n\n";

        return;
    }

    chat.innerHTML +=
    data.choices[0].message.content
    + "\n\n";
}

</script>

    </body>
</html>
