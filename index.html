<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Cha-syuTalk</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:black;
        font-family:sans-serif;
    }

    .container{
        width:90%;
        max-width:500px;
        display:flex;
        flex-direction:column;
        gap:20px;
    }

    /* 解答欄 */
    #answer{
        background:white;
        color:black;
        padding:20px;
        border-radius:12px;
        min-height:40px;
        font-size:24px;
        text-align:center;
        word-break:break-word;
    }

    /* 入力欄 */
    #input{
        padding:18px;
        font-size:22px;
        border:none;
        border-radius:12px;
        outline:none;
        background:#222;
        color:white;
    }
</style>
</head>
<body>

<div class="container">

    <!-- 解答表示 -->
    <div id="answer">
        ここに解答が表示されます
    </div>

    <!-- 入力 -->
    <input
        type="text"
        id="input"
        placeholder="文字を入力..."
    />

</div>

<script>

    // =========================
    // パターンをここにまとめる
    // =========================

    const patterns = {

        "おはよう": "おはようございます",

        "こんにちは": "こんにちは！",

        "こんばんは": "こんばんは！",

        "ありがとう": "どういたしまして！",

        "元気?": "お前は大丈夫か",

        "元気だ":"そっすか"

    };


    // ランダムメッセージ一覧
const randomMessages = [

    "腹減ったな",

    "なんか用か？",

    "暇だなぁ",

    "……。",

    "知らんな",

    "眠い",

    "入力してみろ"

];
    // =========================
    // システム本体
    // =========================

    const input = document.getElementById("input");
    const answer = document.getElementById("answer");

    input.addEventListener("input", () => {

        const text = input.value.trim();

        // パターンに存在するなら表示
        if(patterns[text]){
            answer.textContent = patterns[text];
        }
        else{
           const randomIndex =
    Math.floor(Math.random() * randomMessages.length);

answer.textContent =
    randomMessages[randomIndex];
        }

    });

</script>

</body>
</html>
