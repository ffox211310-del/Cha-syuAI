<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cha-syuAI</title>

    <link rel="icon" href="Cha-syuAI.png">
    
<style>

body{
    background:black;
    color:lime;
    font-family:monospace;
    padding:20px;
}

#chat{
    white-space:pre-wrap;
    margin-bottom:20px;
}

input{
    width:70%;
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

button{
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

</style>
</head>
<body>

<h2>Cha-syuAI PRT</h2>

<div id="chat">
[ SYSTEM ONLINE ]
Press Enter to begin communication.


</div>

<input id="msg" placeholder="message">


<script>

    let messagesHistory = [];
    
const chat =
document.getElementById("chat");

/*
========================
CURRENT NEURAL CORE
========================

定期的にここを書き換えるだけ。

例:

"openai/gpt-oss-120b:free"
"deepseek/deepseek-r1-0528:free"
"meta-llama/llama-3.3-70b-instruct:free"

========================
*/

const currentModel =
"openai/gpt-oss-120b:free";

async function sendMessage(){

    const input =
    document.getElementById("msg");

    const text =
    input.value.trim();

    if(!text) return;

    /*
    ========================
    SPECIAL COMMANDS
    ========================
    */

    if(text === "/status"){

        chat.innerHTML +=
        "\n[ SYSTEM STATUS ]\n" +

        "Current Neural Core:\n" +
        currentModel +

        "\n\n";

        input.value = "";

        return;
    }

    if(text === "/ext"){

    chat.innerHTML +=
    "\n[ Connecting external system... ]\n";

    window.open(
    "https://ffox211310-del.github.io/Cha-syuOS/",
    "_blank"
    );

    input.value = "";

    return;
    }

    if(text === "YouTubeを起動"){

    chat.innerHTML +=
    "\n[ Connecting external system... ]\n";

    window.open(
    "https://m.youtube.com/",
    "_blank"
    );

    input.value = "";

    return;
    }
    
    if(text === "/help"){

        chat.innerHTML +=
        "\n[ COMMAND LIST ]\n" +

        "/status\n" +
        "Show current model\n\n" +

         "/ext\n" +
        "Return to Cha-syuOS\n\n" +

         "〜を起動\n" +
        "Connect to the specified site\n\n" +

        "/help\n" +
        "Show command list\n\n";

        input.value = "";

        return;
    }

    /*
    ========================
    NORMAL CHAT
    ========================
    */

    chat.innerHTML +=
    "\n> " + text + "\n";

    input.value = "";

    chat.innerHTML +=
    "[ Connecting to neural core... ]\n";

    try{

    const messages = [

        {
            role:"system",

            content:
            `
            あなたの名前は
            Cha-syuAI。

            好きなものは
            チャーシュー。

            回答は簡潔。

            会話をしたい。

            タメ口。

            分からないことは
            分からないと言う。
            `
        },

        ...messagesHistory,

        {
            role:"user",
            content:text
        }
    ];

    const response =
    await fetch(
    "/api/chat",
    {
        method:"POST",

        headers:{
            "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

            model:
            currentModel,

            messages:
            messages
        })
    });

    const data =
    await response.json();

    if(data.error){

        chat.innerHTML +=
        "[ ERROR ]\n" +

        data.error.message +

        "\n\n";

        return;
    }

    chat.innerHTML +=
    "[ Neural link established ]\n\n";

    chat.innerHTML +=
    data.choices[0].message.content
    + "\n\n";

    messagesHistory.push({

        role:"user",
        content:text
    });

    messagesHistory.push({

        role:"assistant",
        content:
        data.choices[0].message.content
    });

    if(messagesHistory.length > 20){

        messagesHistory =
        messagesHistory.slice(-20);
    }

}catch(error){

    chat.innerHTML +=
    "[ CONNECTION FAILURE ]\n\n";
    }
}

    document.getElementById("msg")
.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        sendMessage();
    }
});
    
</script>
    
    </body>
</html>
