<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cha-syuAI</title>

    <link rel="icon" href="Cha-syuAI.png">
    
<style>

body{
    background:black;
    color:lime;
    font-family:monospace;
    padding:20px;
}

#chat{
    white-space:pre-wrap;
    margin-bottom:20px;
}

input{
    width:70%;
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

button{
    background:black;
    color:lime;
    border:1px solid lime;
    padding:10px;
}

</style>
</head>
<body>

<h2>Cha-syuAI v1.0　Reversible</h2>

<div id="chat">
[ SYSTEM ONLINE ]
Connecting to neural network...OK!!
</div>

<input id="msg" placeholder="message">
<button onclick="sendMessage()">SEND</button>

<script>

    let currentModel =
"qwen/qwen3-32b";
    
const chat =
document.getElementById("chat");

async function sendMessage(){

    const input =
    document.getElementById("msg");

    const text = input.value;

    if(text === "/deepseek"){

    currentModel =
    "deepseek/deepseek-chat-v3:free";

    chat.innerHTML +=
    "\n[ Switching neural core... ]\n" +
    "[ DeepSeek connected ]\n";

    input.value = "";

    return;
}

if(text === "/llama"){

    currentModel =
    "meta-llama/llama-4-maverick:free";

    chat.innerHTML +=
    "\n[ Switching neural core... ]\n" +
    "[ Llama connected ]\n";

    input.value = "";

    return;
}

if(text === "/qwen"){

    currentModel =
    "qwen/qwen3-32b";

    chat.innerHTML +=
    "\n[ Switching neural core... ]\n" +
    "[ Qwen connected ]\n";

    input.value = "";

    return;
}
    
    if(!text) return;

    chat.innerHTML += "\n> " + text + "\n";

    input.value = "";

    chat.innerHTML +=
    "[ Generating response... ]\n";

    const response = await fetch(
    "/api/chat",
    {
        method:"POST",

        headers:{
            "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

            model:
　　　　　　　　currentModel,
            
            messages:[

                {
                    role:"system",

                    content:
                    `
                    あなたの名前はCha-syuAI。

                    Qwenによって動作してる。
                    
                    好きなものはチャーシュー。

                    回答は簡素です。

                    GeminiというAIは苦手。

               　　　 タメ口で話す。
                
                    分からないことは、分からないと言う。
                    
                    `
                },

                {
                    role:"user",
                    content:text
                }
            ]

        })
    });

    const data =
    await response.json();

    chat.innerHTML +=
    data.choices[0].message.content
    + "\n\n";
}

</script>

</body>
</html>
